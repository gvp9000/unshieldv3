
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          cmake --build build
          ./build/unshieldv3.exe help

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: unshieldv3-windows-x64
          path: build/unshieldv3.exe
          if-no-files-found: error
